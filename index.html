<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prevista Finance</title>
  <meta name="theme-color" content="#1e3a42" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f1ec;
      --bg-elevated: #fbfaf6;
      --surface: #fffcf7;
      --fg: #1b1c1a;
      --fg-muted: #5c5e5a;
      --fg-subtle: #8a8c87;
      --border: color-mix(in oklab, var(--fg) 12%, transparent);
      --border-strong: color-mix(in oklab, var(--fg) 22%, transparent);
      --accent: #1e3a42;
      --accent-2: #2a4d57;
      --accent-fg: #f3f1ec;
      --ink-soft: #d7e1e4;
      --danger: #8f3a32;
      --danger-bg: #f8ece9;
      --warning: #8a5a1f;
      --warning-bg: #f6eedf;
      --success: #2c5a45;
      --success-bg: #e7f0ea;
      --info: #2a4d57;
      --info-bg: #e7eef0;
      --shadow: 0 0 0 1px rgba(27, 28, 26, 0.06), 0 1px 2px -1px rgba(27, 28, 26, 0.06), 0 2px 8px rgba(27, 28, 26, 0.04);
      --shadow-hover: 0 0 0 1px rgba(27, 28, 26, 0.09), 0 8px 24px rgba(27, 28, 26, 0.06);
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --font-serif: "IBM Plex Serif", Georgia, serif;
      --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --text-xs: 0.75rem;
      --text-sm: 0.8125rem;
      --text-base: 0.9375rem;
      --text-lg: 1.125rem;
      --text-xl: 1.5rem;
      --text-2xl: 1.875rem;
      --leading-tight: 1.15;
      --leading-snug: 1.3;
      --leading-normal: 1.5;
      --motion-quick: 150ms;
      --motion-fast: 250ms;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --sidebar: 248px;
      --grok: 360px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { background: none; border: 0; }
    button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
    h1, h2, h3 { text-wrap: balance; }
    p { text-wrap: pretty; }
    .app {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      min-height: 100%;
      min-height: 100dvh;
    }
    .app.grok-open { grid-template-columns: var(--sidebar) minmax(0, 1fr) var(--grok); }
    .sidebar {
      background: var(--accent);
      color: var(--accent-fg);
      display: flex;
      flex-direction: column;
      padding: 20px 14px 16px;
      position: sticky;
      top: 0;
      height: 100dvh;
      overflow: auto;
    }
    .brand { display: flex; gap: 12px; align-items: center; padding: 4px 10px 20px; }
    .mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: color-mix(in oklab, white 10%, transparent);
      display: grid; place-items: center; flex-shrink: 0;
    }
    .mark svg { width: 16px; height: 16px; }
    .brand-name { font-family: var(--font-serif); font-weight: 600; letter-spacing: -0.03em; font-size: 1.05rem; }
    .brand-sub { font-size: var(--text-xs); color: color-mix(in oklab, var(--accent-fg) 62%, transparent); margin-top: 1px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav button {
      display: flex; align-items: center; gap: 10px;
      color: color-mix(in oklab, var(--accent-fg) 78%, transparent);
      padding: 10px 12px; border-radius: 10px; text-align: left;
      min-height: 40px;
      transition: background var(--motion-quick) var(--ease-out), color var(--motion-quick) var(--ease-out);
    }
    .nav button:hover { background: color-mix(in oklab, white 8%, transparent); color: var(--accent-fg); }
    .nav button.active { background: color-mix(in oklab, white 12%, transparent); color: var(--accent-fg); font-weight: 500; }
    .nav svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.9; }
    .sidebar-foot { margin-top: auto; padding: 16px 10px 4px; font-size: var(--text-xs); color: color-mix(in oklab, var(--accent-fg) 55%, transparent); }
    .sidebar-foot button { color: inherit; text-decoration: underline; text-underline-offset: 2px; padding: 8px 0; }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 18px 28px 8px; flex-wrap: wrap;
    }
    .page-title { font-family: var(--font-serif); font-size: var(--text-2xl); letter-spacing: -0.03em; line-height: var(--leading-tight); margin: 0; font-weight: 600; }
    .page-sub { color: var(--fg-muted); font-size: var(--text-sm); margin: 6px 0 0; }
    .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .content { padding: 12px 28px 40px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 40px; padding: 0 14px 0 12px; border-radius: 10px; font-weight: 500;
      transition: transform var(--motion-quick) var(--ease-out), background var(--motion-quick) var(--ease-out), box-shadow var(--motion-quick) var(--ease-out);
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { background: var(--accent-2); }
    .btn-ghost { background: transparent; color: var(--fg); box-shadow: var(--shadow); }
    .btn-ghost:hover { box-shadow: var(--shadow-hover); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); }
    .btn svg { width: 15px; height: 15px; }
    .btn-sm { min-height: 32px; padding: 0 10px; font-size: var(--text-sm); border-radius: 8px; }
    .demo-chip, .chip, .status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 4px 8px; border-radius: 999px;
    }
    .demo-chip { background: var(--warning-bg); color: var(--warning); }
    .status-draft { background: #eeeae3; color: var(--fg-muted); }
    .status-sent, .status-open { background: var(--info-bg); color: var(--info); }
    .status-paid { background: var(--success-bg); color: var(--success); }
    .status-overdue { background: var(--danger-bg); color: var(--danger); }
    .status-closed { background: var(--success-bg); color: var(--success); }
    .status-in-progress { background: var(--warning-bg); color: var(--warning); }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .card {
      background: var(--surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .card h3 { margin: 0; font-size: var(--text-sm); color: var(--fg-muted); font-weight: 500; letter-spacing: 0.02em; }
    .metric { font-variant-numeric: tabular-nums; font-size: 1.55rem; font-weight: 500; letter-spacing: -0.03em; margin: 8px 0 0; line-height: 1.1; }
    .metric.neg { color: var(--danger); }
    .metric-sub { font-size: var(--text-xs); color: var(--fg-subtle); margin-top: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .section-title { font-family: var(--font-serif); font-size: 1.15rem; margin: 0 0 12px; letter-spacing: -0.02em; }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .search, .field input, .field select, .field textarea, .toolbar input, .toolbar select {
      background: var(--surface); box-shadow: inset 0 0 0 1px var(--border);
      border: 0; border-radius: 10px; min-height: 40px; padding: 0 12px; outline: none; width: 100%;
    }
    .field textarea { padding: 10px 12px; min-height: 88px; resize: vertical; }
    .search:focus, .field input:focus, .field select:focus, .field textarea:focus, .toolbar input:focus, .toolbar select:focus {
      box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px color-mix(in oklab, var(--accent) 16%, transparent);
    }
    .search { max-width: 280px; }
    .toolbar select, .toolbar input[type="date"] { width: auto; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    th { text-align: left; font-weight: 500; color: var(--fg-subtle); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: var(--bg-elevated); }
    .num { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--font-mono); font-size: 0.8rem; }
    .muted { color: var(--fg-muted); }
    .subtle { color: var(--fg-subtle); }
    .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .empty {
      text-align: center; padding: 48px 20px; color: var(--fg-muted);
    }
    .empty h3 { font-family: var(--font-serif); color: var(--fg); margin: 0 0 8px; }
    .coa-group { margin-bottom: 22px; }
    .coa-head { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-subtle); margin: 0 0 8px; font-weight: 600; }
    .bar { height: 8px; background: #ebe7de; border-radius: 99px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
    .check-item {
      display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: start;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .check-item input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--accent); }
    .scrim { display: none; }
    dialog {
      border: 0; padding: 0; border-radius: var(--radius-xl);
      box-shadow: var(--shadow-hover); width: min(720px, calc(100vw - 32px));
      background: var(--surface); color: var(--fg);
    }
    dialog::backdrop { background: rgba(27, 28, 26, 0.38); }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 22px 22px 8px; }
    .modal-head h2 { margin: 0; font-family: var(--font-serif); font-size: 1.35rem; letter-spacing: -0.03em; }
    .modal-body { padding: 8px 22px 22px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 22px 22px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.span-2 { grid-column: span 2; }
    .field label { font-size: var(--text-xs); font-weight: 500; color: var(--fg-muted); }
    .lines { display: flex; flex-direction: column; gap: 8px; }
    .line { display: grid; grid-template-columns: 1fr 72px 110px 32px; gap: 8px; }
    .grok {
      background: var(--bg-elevated);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column; height: 100dvh; position: sticky; top: 0;
    }
    .grok-head { padding: 18px 16px 10px; display: flex; justify-content: space-between; align-items: center; }
    .grok-head h2 { font-family: var(--font-serif); font-size: 1.05rem; margin: 0; }
    .grok-suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
    .grok-suggest button {
      font-size: 11px; padding: 8px 10px; border-radius: 999px; background: var(--surface);
      box-shadow: var(--shadow); color: var(--fg-muted); min-height: 32px;
    }
    .grok-log { flex: 1; overflow: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
    .bubble { padding: 10px 12px; border-radius: 12px; font-size: var(--text-sm); line-height: 1.45; white-space: pre-wrap; }
    .bubble.user { background: var(--accent); color: var(--accent-fg); align-self: flex-end; border-bottom-right-radius: 4px; }
    .bubble.bot { background: var(--surface); box-shadow: var(--shadow); align-self: stretch; border-bottom-left-radius: 4px; }
    .grok-form { display: flex; gap: 8px; padding: 12px 16px 16px; }
    .grok-form textarea { min-height: 44px; max-height: 120px; flex: 1; }
    .menu-btn { display: none; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: var(--accent-fg); padding: 10px 14px; border-radius: 999px;
      font-size: var(--text-sm); z-index: 20; box-shadow: var(--shadow-hover);
    }
    .pl-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 7px 0; }
    .pl-row.total { border-top: 1px solid var(--border-strong); margin-top: 8px; padding-top: 12px; font-weight: 600; }
    .pl-indent { padding-left: 16px; color: var(--fg-muted); }
    @media (max-width: 1100px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .app, .app.grok-open { grid-template-columns: var(--sidebar) minmax(0, 1fr); }
      .grok { position: fixed; right: 0; top: 0; width: min(var(--grok), 100vw); z-index: 10; box-shadow: var(--shadow-hover); }
    }
    @media (max-width: 840px) {
      .app, .app.grok-open { grid-template-columns: 1fr; }
      .sidebar { position: fixed; z-index: 12; transform: translateX(-102%); width: min(280px, 86vw); transition: transform var(--motion-fast) var(--ease-out); }
      .sidebar.open { transform: none; }
      .menu-btn { display: inline-flex; }
      .scrim.open {
        display: block; position: fixed; inset: 0; z-index: 11;
        background: rgba(27, 28, 26, 0.4);
      }
      .topbar, .content { padding-left: 16px; padding-right: 16px; }
      .fields, .line { grid-template-columns: 1fr; }
      .field.span-2 { grid-column: span 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
    @media print {
      .sidebar, .top-actions, .grok, .toolbar, .row-actions, .menu-btn, .toast { display: none !important; }
      .app, .app.grok-open { display: block; }
      .content { padding: 0; }
      .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
      body { background: white; }
    }
  </style>
</head>
<body>
<!--
  Prevista LLC — Finance Console (drop-in HTML)

  How the CTO mounts this in the company app
  ------------------------------------------
  1. Copy this file into the main app (static host, iframe, or paste into a route).
  2. Parent app owns auth. Do not add a login wall here.
  3. Optional: set config BEFORE this file runs:
       window.PrevistaFinanceConfig = { apiBase, grokEndpoint, mode: "local"|"api" }
     or edit the object in the script below.
  4. Parent iframe may postMessage({ type: "prevista:finance:config", config: {...} }).
  5. Listen on window:
       prevista:finance:changed     { types, record }
       prevista:finance:ask-grok    { prompt, screen, records, company }
       prevista:finance:grok-reply  { prompt, reply, source }

  REST shapes when mode === "api"  (apiBase default "/api/finance")
  ----------------------------------------------------------------
  Types: accounts, members, clients, vendors, invoices, bills, expenses, transactions, closeChecklists

  GET    {apiBase}/{type}           → { data: Record[] }
  POST   {apiBase}/{type}           → { data: Record }          body: record (create)
  PUT    {apiBase}/{type}/{id}      → { data: Record }          body: record (update)
  DELETE {apiBase}/{type}/{id}      → { ok: true }

  Every record: { id: string, createdAt: ISO, updatedAt: ISO, ...type fields }

  Grok: POST {grokEndpoint}  body: { prompt, screen, records, company: "Prevista LLC" }
        → { reply: string }

  Public hooks: window.PrevistaFinance = { config, api, store, askGrok, getState, setScreen, exportCsv }
-->
<div id="app"></div>
<dialog id="modal" aria-labelledby="modal-title"></dialog>
<div id="toast" class="toast" hidden></div>
<script>
window.PrevistaFinanceConfig = Object.assign({
  apiBase: "/api/finance",
  grokEndpoint: "/api/grok/finance",
  mode: "local"
}, window.PrevistaFinanceConfig || {});

(function () {
  "use strict";

  const CONFIG = window.PrevistaFinanceConfig;
  const COMPANY = "Prevista LLC";
  const STORAGE_KEY = "prevista.finance.v1";
  const SCREENS = [
    ["dashboard", "Dashboard"],
    ["accounts", "Chart of Accounts"],
    ["invoices", "Invoices / AR"],
    ["bills", "Bills / AP"],
    ["expenses", "Expenses"],
    ["register", "Register"],
    ["reports", "Reports"],
    ["close", "Close"]
  ];

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "\u0026amp;",
    "<": "\u0026lt;",
    ">": "\u0026gt;",
    '"': "\u0026quot;",
    "'": "\u0026#39;"
  }[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id_" + Math.random().toString(36).slice(2, 10));
  const now = () => new Date().toISOString();
  const today = () => isoDate(new Date());
  const isoDate = (d) => {
    const x = d instanceof Date ? d : new Date(d);
    const y = x.getFullYear();
    const m = String(x.getMonth() + 1).padStart(2, "0");
    const day = String(x.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };
  const monthStart = (d = new Date()) => isoDate(new Date(d.getFullYear(), d.getMonth(), 1));
  const monthEnd = (d = new Date()) => isoDate(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  const addDays = (iso, n) => {
    const d = new Date(iso + "T12:00:00");
    d.setDate(d.getDate() + n);
    return isoDate(d);
  };
  const fmtDate = (iso) => {
    if (!iso) return "—";
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  };
  const money = (n) => {
    const v = Math.round((Number(n) || 0) * 100) / 100;
    const abs = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (v < 0 ? "−$" : "$") + abs;
  };
  const num = (n) => Math.round((Number(n) || 0) * 100) / 100;
  const formatReply = (text) => esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const debounce = (fn, ms) => {
    let t;
    return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  };

  const ICONS = {
    dashboard: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    accounts: '<path d="M4 7h16M4 12h16M4 17h10"/>',
    invoices: '<path d="M7 3h8l5 5v13H7z"/><path d="M15 3v5h5"/><path d="M10 13h6M10 17h4"/>',
    bills: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/>',
    expenses: '<circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 11h6"/>',
    register: '<path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/>',
    reports: '<path d="M5 19V9l4 3 3-6 3 4 4-2v11z"/>',
    close: '<path d="M5 6h14M5 12h14M5 18h8"/><path d="M16 16l2 2 4-4"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    grok: '<circle cx="12" cy="12" r="8"/><path d="M8 13c.8 1.4 2 2.2 4 2.2s3.2-.8 4-2.2M9 9h.01M15 9h.01"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    print: '<path d="M6 9V4h12v5"/><rect x="6" y="13" width="12" height="7"/><path d="M6 13H4V9h16v4h-2"/>',
    download: '<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>'
  };
  function icon(name) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
  }

  const TYPES = ["accounts", "members", "clients", "vendors", "invoices", "bills", "expenses", "transactions", "closeChecklists"];

  function seed() {
    const ts = "2026-07-01T14:00:00.000Z";
    const accounts = [
      ["acct-1000", "1000", "Operating Checking", "asset", "Primary operating cash. DEMO — no real bank account."],
      ["acct-1100", "1100", "Accounts Receivable", "asset", "Unpaid client invoices."],
      ["acct-2000", "2000", "Accounts Payable", "liability", "Unpaid vendor bills."],

  function invoiceTotal(inv) {
    return num((inv.lines || []).reduce((s, l) => s + num(l.qty) * num(l.rate), 0));
  }
  function debitNormal(type) {
    return type === "asset" || type === "expense" || type === "cogs";
  }
  function byId(data, type, id) {
    return (data[type] || []).find((r) => r.id === id);
  }
  function computedInvoiceStatus(inv) {
    if (inv.status === "paid" || inv.status === "draft") return inv.status;
    if (inv.dueDate && inv.dueDate < today()) return "overdue";
    return inv.status || "sent";
  }
  function computedBillStatus(bill) {
    if (bill.status === "paid" || bill.status === "draft") return bill.status;
    if (bill.dueDate && bill.dueDate < today()) return "overdue";
    return bill.status || "open";
  }

  function upsertTxn(data, postingKind, sourceType, sourceId, spec) {
    let txn = data.transactions.find((t) => t.postingKind === postingKind && t.sourceId === sourceId);
    const stamp = now();
    if (!txn) {
      txn = { id: uid(), createdAt: stamp, sourceType, sourceId, postingKind };
      data.transactions.push(txn);
    }
    Object.assign(txn, spec, { updatedAt: stamp, sourceType, sourceId, postingKind });
    return txn;
  }
  function removePostings(data, sourceId, kinds) {
    data.transactions = data.transactions.filter((t) => !(t.sourceId === sourceId && kinds.includes(t.postingKind)));
  }

  function syncPostings(data) {
    for (const inv of data.invoices) {
      const total = invoiceTotal(inv);
      const status = inv.status;
      if (status === "draft" || total === 0) {
        removePostings(data, inv.id, ["invoice-send", "invoice-pay"]);
        continue;
      }
      upsertTxn(data, "invoice-send", "invoice", inv.id, {
        date: inv.date, ref: inv.number, memo: (inv.memo || "Invoice") + " · AR / revenue",
        lines: [
          { accountId: "acct-1100", debit: total, credit: 0 },
          { accountId: inv.accountId || "acct-4000", debit: 0, credit: total }
        ]
      });
      if (status === "paid") {
        upsertTxn(data, "invoice-pay", "invoice", inv.id, {
          date: inv.paidDate || inv.date, ref: inv.number, memo: (inv.memo || "Invoice") + " · cash receipt",
          lines: [
            { accountId: "acct-1000", debit: total, credit: 0 },
            { accountId: "acct-1100", debit: 0, credit: total }
          ]
        });
      } else {
        removePostings(data, inv.id, ["invoice-pay"]);
      }
    }
    for (const bill of data.bills) {
      const amount = num(bill.amount);
      if (bill.status === "draft" || amount === 0) {
        removePostings(data, bill.id, ["bill-open", "bill-pay"]);
        continue;
      }
      upsertTxn(data, "bill-open", "bill", bill.id, {
        date: bill.date, ref: bill.number, memo: (bill.memo || "Bill") + " · AP",
        lines: [
          { accountId: bill.accountId || "acct-6000", debit: amount, credit: 0 },
          { accountId: "acct-2000", debit: 0, credit: amount }
        ]
      });
      if (bill.status === "paid") {
        upsertTxn(data, "bill-pay", "bill", bill.id, {
          date: bill.paidDate || bill.date, ref: bill.number, memo: (bill.memo || "Bill") + " · payment",
          lines: [
            { accountId: "acct-2000", debit: amount, credit: 0 },
            { accountId: "acct-1000", debit: 0, credit: amount }
          ]
        });
      } else {
        removePostings(data, bill.id, ["bill-pay"]);
      }
    }
    for (const exp of data.expenses) {
      const amount = num(exp.amount);
      if (amount === 0) {
        removePostings(data, exp.id, ["expense"]);
        continue;
      }
      upsertTxn(data, "expense", "expense", exp.id, {
        date: exp.date, ref: "EXP", memo: (exp.vendorName || "Expense") + (exp.receiptNote ? " · " + exp.receiptNote : ""),
        lines: [
          { accountId: exp.accountId || "acct-6400", debit: amount, credit: 0 },
          { accountId: exp.paymentAccountId || "acct-1000", debit: 0, credit: amount }
        ]
      });
    }
  }

  function accountBalance(data, accountId, asOf, from) {
    const acct = byId(data, "accounts", accountId);
    if (!acct) return 0;
    let bal = 0;
    for (const txn of data.transactions) {
      if (from && txn.date < from) continue;
      if (asOf && txn.date > asOf) continue;
      for (const line of txn.lines || []) {
        if (line.accountId !== accountId) continue;
        const net = debitNormal(acct.type) ? num(line.debit) - num(line.credit) : num(line.credit) - num(line.debit);
        bal += net;
      }
    }
    return num(bal);
  }

  function pnl(data, from, to) {
    const buckets = { income: [], cogs: [], expense: [] };
    const totals = { income: 0, cogs: 0, expense: 0 };
    for (const acct of data.accounts.filter((a) => ["income", "cogs", "expense"].includes(a.type))) {
      const amount = accountBalance(data, acct.id, to, from);
      if (!amount) continue;
      buckets[acct.type].push({ acct, amount });
      totals[acct.type] += amount;
    }
    const gross = num(totals.income - totals.cogs);
    const net = num(gross - totals.expense);
    return { buckets, totals, gross, net };
  }

  function cashSummary(data, from, to) {
    const opening = accountBalance(data, "acct-1000", addDays(from, -1));
    let inflows = 0, outflows = 0;
    for (const txn of data.transactions) {
      if (txn.date < from || txn.date > to) continue;
      for (const line of txn.lines || []) {
        if (line.accountId !== "acct-1000") continue;
        inflows += num(line.debit);
        outflows += num(line.credit);
      }
    }
    const ending = num(opening + inflows - outflows);
    return { opening, inflows, outflows, ending };
  }

  function arAp(data) {
    const ar = data.invoices.filter((i) => computedInvoiceStatus(i) !== "paid" && i.status !== "draft").reduce((s, i) => s + invoiceTotal(i), 0);
    const ap = data.bills.filter((b) => computedBillStatus(b) !== "paid" && b.status !== "draft").reduce((s, b) => s + num(b.amount), 0);
    return { ar: num(ar), ap: num(ap) };
  }

  /* ---------- persistence / API adapters ---------- */
  let data = null;

  const localApi = {
    async list(type) {
      return (data[type] || []).slice();
    },
    async save(type, record) {
      const list = data[type] || (data[type] = []);
      const stamp = now();
      const next = { ...record, id: record.id || uid(), createdAt: record.createdAt || stamp, updatedAt: stamp };
      const idx = list.findIndex((r) => r.id === next.id);
      if (idx >= 0) list[idx] = next;
      else list.push(next);
      persist();
      emitChanged(type, next);
      return next;
    },
    async remove(type, id) {
      data[type] = (data[type] || []).filter((r) => r.id !== id);
      persist();
      emitChanged(type, { id, deleted: true });
      return { ok: true };
    }
  };

  const remoteApi = {
    async list(type) {
      const res = await fetch(`${CONFIG.apiBase}/${type}`);
      if (!res.ok) throw new Error(`list ${type} failed (${res.status})`);
      const body = await res.json();
      return body.data || body;
    },
    async save(type, record) {
      const isNew = !record.id;
      const url = isNew ? `${CONFIG.apiBase}/${type}` : `${CONFIG.apiBase}/${type}/${record.id}`;
      const res = await fetch(url, {
        method: isNew ? "POST" : "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(record)
      });
      if (!res.ok) throw new Error(`save ${type} failed (${res.status})`);
      const body = await res.json();
      const saved = body.data || body;
      emitChanged(type, saved);
      return saved;
    },
    async remove(type, id) {
      const res = await fetch(`${CONFIG.apiBase}/${type}/${id}`, { method: "DELETE" });
      if (!res.ok) throw new Error(`remove ${type} failed (${res.status})`);
      emitChanged(type, { id, deleted: true });
      return { ok: true };
    }
  };

  const api = CONFIG.mode === "api" ? remoteApi : localApi;

  function loadLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);

        if (parsed && parsed.version === 1 && Array.isArray(parsed.accounts) && Array.isArray(parsed.invoices)) {
          data = parsed;
          return;
        }
      }
    } catch (_) { /* reseed */ }
    data = seed();
    persist();
  }

  async function loadRemote() {
    data = { version: 1, company: COMPANY };
    for (const type of TYPES) {
      data[type] = await api.list(type);

  function persist() {
    if (CONFIG.mode !== "local") return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (_) { /* quota */ }
  }

  function emitChanged(type, record) {
    window.dispatchEvent(new CustomEvent("prevista:finance:changed", { detail: { type, record, company: COMPANY } }));

  function stubReply(prompt, context) {

    if (q.includes("reminder") || q.includes("draft invoice")) {
      const target = overdueInv[0] || data.invoices.find((i) => computedInvoiceStatus(i) === "sent");
      if (!target) return "No open invoices to chase. Draft one on the Invoices screen when a client is ready.";

      return `Subject: ${target.number} — ${COMPANY} reminder\n\nHi ${client ? client.name.replace("DEMO · ", "") : "there"},\n\nFollowing up on ${target.number} for ${money(invoiceTotal(target))}, due ${fmtDate(target.dueDate)} (${target.phase ? "Phase " + target.phase : "services"}).\n\nPlease send payment to Prevista LLC operating accounts on file, or let us know if you need a copy of the invoice.\n\nThank you,\nPrevista Finance`;
    }

      const invLines = overdueInv.map((i) => `• ${i.number} ${byId(data, "clients", i.clientId)?.name || ""} ${money(invoiceTotal(i))} due ${fmtDate(i.dueDate)}`).join("\n") || "None.";
      const billLines = overdueBills.map((b) => `• ${b.number} ${byId(data, "vendors", b.vendorId)?.name || ""} ${money(b.amount)} due ${fmtDate(b.dueDate)}`).join("\n") || "None.";
      return `Overdue AR\n${invLines}\n\nOverdue AP\n${billLines}\n\nCash on hand ${money(cash)}. Cover AP first if Harbor collection slips another week.`;

      return `Monthly close brief — ${view.closePeriod}\n\nCash ${money(cash)} · AR ${money(ar)} · AP ${money(ap)}\nPeriod net ${money(report.net)} on ${money(report.totals.income)} revenue.\nChecklist ${done}/7 · status ${cl.status}.\n\nOpen items: ${overdueInv.length} overdue invoice(s), ${overdueBills.length} overdue bill(s).\nSend P&L to CEO, cash view to CTO, AP aging to COO when the remaining boxes are ticked.`;

    }

        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("endpoint " + res.status);
      const body = await res.json();
      reply = body.reply || body.text || body.message;
      if (!reply) throw new Error("empty reply");
    } catch (_) {
      source = "stub";
      reply = stubReply(prompt, payload.records);
    }
    window.dispatchEvent(new CustomEvent("prevista:finance:grok-reply", { detail: { prompt, reply, source, company: COMPANY } }));
    return { reply, source };
  }

  async function sendGrok(prompt) {
    const text = (prompt || "").trim();
    if (!text || view.grokBusy) return;
    view.grokOpen = true;
    view.grokMessages.push({ role: "user", text });
    view.grokBusy = true;
    render();
    const { reply, source } = await askGrok(text);
    view.grokMessages.push({ role: "bot", text: reply, source });
    view.grokBusy = false;
    render();
    const log = $(".grok-log");
    if (log) log.scrollTop = log.scrollHeight;
  }

  /* ---------- close helpers ---------- */
  const CLOSE_ITEMS = [
    ["reconcile", "Reconcile operating checking", "Match cash to the ledger. DEMO books have no live bank feed."],
    ["unpaidInvoices", "Review unpaid invoices", "Chase overdue AR before locking the month."],
    ["unpaidBills", "Review unpaid bills", "Confirm AP that should hit this period."],
    ["expenses", "Capture uncoded expenses", "Member receipts and SaaS charges."],
    ["reportsCeo", "Send P&L to CEO", "Alex Chen."],
    ["reportsCto", "Send cash summary to CTO", "Jordan Hale."],
    ["reportsCoo", "Send AP aging to COO", "Sam Rivera."]
  ];

  function closeFor(period) {
    let row = data.closeChecklists.find((c) => c.period === period);
    if (!row) {
      row = {
        id: "close-" + period, period, status: "open", notes: "", closedAt: null,
        items: Object.fromEntries(CLOSE_ITEMS.map(([k]) => [k, false])),
        createdAt: now(), updatedAt: now()
      };
      data.closeChecklists.push(row);
      persist();
    }
    return row;
  }

  function closeStatusOf(row) {
    const vals = CLOSE_ITEMS.map(([k]) => row.items?.[k]);
    if (row.status === "closed" || vals.every(Boolean)) return "closed";
    if (vals.some(Boolean)) return "in-progress";
    return "open";
  }

          ${kpiCard("Accounts payable", money(ap), `${overdueBills.length} overdue`)}

  function cashImpact(txn) {
    return num((txn.lines || []).filter((l) => l.accountId === "acct-1000").reduce((s, l) => s + num(l.debit) - num(l.credit), 0));
  }

  function renderRegister() {
    const q = view.query.toLowerCase();

    const body = rows.map((t) => {

      return `<tr>
        <td>${esc(fmtDate(t.date))}</td>
        <td>${esc(t.ref || "")}</td>

        <td class="muted">${esc(acctNames)}</td>
        <td class="num">${impact > 0 ? money(impact) : ""}</td>

        <td class="num">${money(running)}</td>
      </tr>`;

    return `
      ${topbar("Transactions / Register", "Ledger postings from invoices, bills, expenses, and opening balance")}

  function renderClose() {
    const row = closeFor(view.closePeriod);
    const status = closeStatusOf(row);
    const { ar, ap } = arAp(data);
    const overdueInv = data.invoices.filter((i) => computedInvoiceStatus(i) === "overdue").length;
    const overdueBills = data.bills.filter((b) => computedBillStatus(b) === "overdue").length;
    const hints = {
      unpaidInvoices: `${overdueInv} overdue · AR ${money(ar)}`,
      unpaidBills: `${overdueBills} overdue · AP ${money(ap)}`,
      expenses: `${data.expenses.length} captured (all-time DEMO)`

    const items = CLOSE_ITEMS.map(([key, label, help]) => `
      <label class="check-item">

  const SCREEN_RENDER = {
    dashboard: renderDashboard,
    accounts: renderAccounts,
    invoices: renderInvoices,
    bills: renderBills,
    expenses: renderExpenses,
    register: renderRegister,

  function render() {
    const fn = SCREEN_RENDER[view.screen] || renderDashboard;
    $("#app").innerHTML = renderShell(fn());
    bindLive();
  }

  function bindLive() {
    $$("[data-bind]").forEach((el) => {
      const apply = () => {
        view[el.dataset.bind] = el.value;
        if (el.dataset.bind === "query" || el.dataset.bind === "filter" || el.dataset.bind === "periodFrom" || el.dataset.bind === "periodTo" || el.dataset.bind === "closePeriod") {
          render();
          const again = $(`[data-bind="${el.dataset.bind}"]`);
          if (again && again !== document.activeElement) {
            again.focus();
            if (again.setSelectionRange && typeof again.value === "string") {
              const len = again.value.length;
              try { again.setSelectionRange(len, len); } catch (_) {}
            }
          }
        }
      };
      el.addEventListener("change", apply);
      if (el.dataset.bind === "query") el.addEventListener("input", debounce(apply, 140));
      else el.addEventListener("input", apply);
    });
  }

  /* ---------- modals ---------- */
  function optionList(list, value, labelFn) {
    return list.map((r) => `<option value="${esc(r.id)}" ${r.id === value ? "selected" : ""}>${esc(labelFn(r))}</option>`).join("");
  }

  function openModal(html) {
    const d = $("#modal");
    d.innerHTML = html;
    if (typeof d.showModal === "function") d.showModal();
    else d.setAttribute("open", "");
    const first = d.querySelector("input, select, textarea, button");
    if (first) first.focus();
  }
  function closeModal() {
    const d = $("#modal");
    if (d.open && d.close) d.close();
    d.removeAttribute("open");
    d.innerHTML = "";
  }

  function accountOptions(types, selected) {
    return optionList(data.accounts.filter((a) => a.active && types.includes(a.type)), selected, (a) => `${a.number} ${a.name}`);
  }

  function invoiceForm(inv) {
    const draft = inv || {
      id: uid(), number: nextNumber("INV-", data.invoices), clientId: data.clients[0]?.id,
      phase: "1a", date: today(), dueDate: addDays(today(), 30), status: "draft",
      accountId: "acct-4000", memo: "", lines: [{ id: uid(), description: "", qty: 1, rate: 0 }]
    };
    view._form = { type: "invoice", draft };
    const lines = draft.lines.map((l, i) => `
      <div class="line">
        <input name="desc-${i}" value="${esc(l.description)}" placeholder="Line description" />
        <input name="qty-${i}" type="number" min="0" step="0.01" value="${esc(l.qty)}" />
        <input name="rate-${i}" type="number" min="0" step="0.01" value="${esc(l.rate)}" />
        <button type="button" class="btn btn-sm btn-ghost" data-act="remove-line" data-i="${i}" ${draft.lines.length === 1 ? "disabled" : ""}>${icon("x")}</button>
      </div>`).join("");
    openModal(`
      <form data-form="invoice">
        <div class="modal-head"><h2 id="modal-title">${inv ? "Edit invoice" : "New invoice"}</h2>
          <button type="button" class="btn btn-sm btn-ghost" data-act="close-modal">${icon("x")}</button></div>
        <div class="modal-body">
          <div class="fields">
            <div class="field"><label>Number</label><input name="number" required value="${esc(draft.number)}" /></div>
            <div class="field"><label>Client</label><select name="clientId">${optionList(data.clients, draft.clientId, (c) => c.name)}</select></div>
            <div class="field"><label>Phase</label><select name="phase">${["1a", "2", "3"].map((p) => `<option ${draft.phase === p ? "selected" : ""}>${p}</option>`).join("")}</select></div>
            <div class="field"><label>Status</label><select name="status">${["draft", "sent", "paid"].map((s) => `<option ${draft.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
            <div class="field"><label>Issue date</label><input type="date" name="date" required value="${esc(draft.date)}" /></div>
            <div class="field"><label>Due date</label><input type="date" name="dueDate" required value="${esc(draft.dueDate)}" /></div>
            <div class="field"><label>Revenue account</label><select name="accountId">${accountOptions(["income"], draft.accountId)}</select></div>
            <div class="field"><label>Paid date</label><input type="date" name="paidDate" value="${esc(draft.paidDate || "")}" /></div>
            <div class="field span-2"><label>Line items</label><div class="lines">${lines}</div>
              <button type="button" class="btn btn-sm btn-ghost" data-act="add-line" style="margin-top:8px">${icon("plus")} Add line</button></div>
            <div class="field span-2"><label>Memo</label><textarea name="memo">${esc(draft.memo || "")}</textarea></div>
          </div>
        </div>
        <div class="modal-foot">
          ${inv ? `<button type="button" class="btn btn-danger" data-act="delete-invoice" data-id="${inv.id}">Delete</button>` : ""}
          <button type="button" class="btn btn-ghost" data-act="close-modal">Cancel</button>
          <button class="btn btn-primary" type="submit">Save invoice</button>
        </div>
      </form>`);
  }

  function billForm(bill) {
    const draft = bill || {
      id: uid(), number: nextNumber("BILL-", data.bills), vendorId: data.vendors[0]?.id, category: "data",
      date: today(), dueDate: addDays(today(), 15), status: "open", accountId: "acct-5000", amount: 0, memo: ""
    };
    openModal(`
      <form data-form="bill">
        <input type="hidden" name="id" value="${esc(draft.id)}" />
        <div class="modal-head"><h2 id="modal-title">${bill ? "Edit bill" : "New bill"}</h2>
          <button type="button" class="btn btn-sm btn-ghost" data-act="close-modal">${icon("x")}</button></div>
        <div class="modal-body"><div class="fields">
          <div class="field"><label>Number</label><input name="number" required value="${esc(draft.number)}" /></div>
          <div class="field"><label>Vendor</label><select name="vendorId">${optionList(data.vendors, draft.vendorId, (v) => v.name)}</select></div>
          <div class="field"><label>Category</label><select name="category">${["data", "media", "contractors", "advisors", "other"].map((c) => `<option ${draft.category === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
          <div class="field"><label>Status</label><select name="status">${["draft", "open", "paid"].map((s) => `<option ${draft.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
          <div class="field"><label>Bill date</label><input type="date" name="date" value="${esc(draft.date)}" required /></div>
          <div class="field"><label>Due date</label><input type="date" name="dueDate" value="${esc(draft.dueDate)}" required /></div>
          <div class="field"><label>Account</label><select name="accountId">${accountOptions(["cogs", "expense"], draft.accountId)}</select></div>
          <div class="field"><label>Amount</label><input type="number" min="0" step="0.01" name="amount" value="${esc(draft.amount)}" required /></div>
          <div class="field"><label>Paid date</label><input type="date" name="paidDate" value="${esc(draft.paidDate || "")}" /></div>
          <div class="field span-2"><label>Memo</label><textarea name="memo">${esc(draft.memo || "")}</textarea></div>
        </div></div>
        <div class="modal-foot">
          ${bill ? `<button type="button" class="btn btn-danger" data-act="delete-bill" data-id="${bill.id}">Delete</button>` : ""}
          <button type="button" class="btn btn-ghost" data-act="close-modal">Cancel</button>
          <button class="btn btn-primary" type="submit">Save bill</button>
        </div>
      </form>`);
  }

  function expenseForm(exp) {
    const draft = exp || {
      id: uid(), date: today(), vendorName: "", accountId: "acct-6000", amount: 0,
      memberId: data.members[0]?.id, receiptNote: "", paymentAccountId: "acct-1000"
    };
    openModal(`
      <form data-form="expense">
        <input type="hidden" name="id" value="${esc(draft.id)}" />
        <div class="modal-head"><h2 id="modal-title">${exp ? "Edit expense" : "Capture expense"}</h2>
          <button type="button" class="btn btn-sm btn-ghost" data-act="close-modal">${icon("x")}</button></div>
        <div class="modal-body"><div class="fields">
          <div class="field"><label>Date</label><input type="date" name="date" value="${esc(draft.date)}" required /></div>
          <div class="field"><label>Vendor</label><input name="vendorName" value="${esc(draft.vendorName)}" required placeholder="Who was paid" /></div>
          <div class="field"><label>Account</label><select name="accountId">${accountOptions(["expense", "cogs"], draft.accountId)}</select></div>
          <div class="field"><label>Amount</label><input type="number" min="0" step="0.01" name="amount" value="${esc(draft.amount)}" required /></div>
          <div class="field"><label>Member who spent</label><select name="memberId">${optionList(data.members, draft.memberId, (m) => `${m.name} · ${m.title}`)}</select></div>
          <div class="field"><label>Paid from</label><select name="paymentAccountId">${accountOptions(["asset", "liability"], draft.paymentAccountId)}</select></div>
          <div class="field span-2"><label>Receipt note</label><textarea name="receiptNote" placeholder="Receipt location or last four">${esc(draft.receiptNote || "")}</textarea></div>
        </div></div>
        <div class="modal-foot">
          ${exp ? `<button type="button" class="btn btn-danger" data-act="delete-expense" data-id="${exp.id}">Delete</button>` : ""}
          <button type="button" class="btn btn-ghost" data-act="close-modal">Cancel</button>
          <button class="btn btn-primary" type="submit">Save expense</button>
        </div>
      </form>`);
  }

  function accountForm(acct) {
    const draft = acct || { id: uid(), number: "", name: "", type: "expense", description: "", active: true };
    openModal(`
      <form data-form="account">
        <input type="hidden" name="id" value="${esc(draft.id)}" />
        <div class="modal-head"><h2 id="modal-title">${acct ? "Edit account" : "New account"}</h2>
          <button type="button" class="btn btn-sm btn-ghost" data-act="close-modal">${icon("x")}</button></div>
        <div class="modal-body"><div class="fields">
          <div class="field"><label>Number</label><input name="number" required value="${esc(draft.number)}" /></div>
          <div class="field"><label>Type</label><select name="type">${["asset", "liability", "equity", "income", "cogs", "expense"].map((t) => `<option ${draft.type === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>
          <div class="field span-2"><label>Name</label><input name="name" required value="${esc(draft.name)}" /></div>
          <div class="field span-2"><label>Description</label><textarea name="description">${esc(draft.description || "")}</textarea></div>
        </div></div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" data-act="close-modal">Cancel</button>
          <button class="btn btn-primary" type="submit">Save account</button>
        </div>
      </form>`);
  }

  function nextNumber(prefix, list) {
    const nums = list.map((r) => parseInt(String(r.number).replace(/\D/g, ""), 10)).filter((n) => !isNaN(n));
    const next = (nums.length ? Math.max(...nums) : 1000) + 1;
    return prefix + next;
  }

  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.hidden = true; }, 2200);
  }

  function exportCsv() {
    const report = pnl(data, view.periodFrom, view.periodTo);
    const cash = cashSummary(data, view.periodFrom, view.periodTo);
    const lines = [
      ["Prevista LLC P&L", view.periodFrom, view.periodTo],
      ["Account", "Type", "Amount"],
      ...["income", "cogs", "expense"].flatMap((t) => report.buckets[t].map(({ acct, amount }) => [acct.number + " " + acct.name, t, amount])),
      ["Gross profit", "", report.gross],
      ["Net income", "", report.net],
      [],
      ["Cash summary"],
      ["Opening", "", cash.opening],
      ["Inflows", "", cash.inflows],
      ["Outflows", "", cash.outflows],
      ["Ending", "", cash.ending]
    ];
    const csv = lines.map((row) => row.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `prevista-finance-${view.periodFrom}-to-${view.periodTo}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast("CSV exported");
  }

  /* ---------- events ---------- */
  document.addEventListener("click", async (e) => {
    const nav = e.target.closest("[data-nav]");
    if (nav) { setScreen(nav.dataset.nav); return; }
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.dataset.act;
    const id = btn.dataset.id;
    if (act === "toggle-grok") { view.grokOpen = !view.grokOpen; render(); return; }
    if (act === "toggle-sidebar") { view.sidebarOpen = !view.sidebarOpen; render(); return; }
    if (act === "close-modal") { closeModal(); return; }
    if (act === "print") { window.print(); return; }
    if (act === "export-csv") { exportCsv(); return; }
    if (act === "grok-suggest") { sendGrok(btn.dataset.prompt); return; }
    if (act === "new-invoice") { invoiceForm(null); return; }
    if (act === "new-bill") { billForm(null); return; }
    if (act === "new-expense") { expenseForm(null); return; }
    if (act === "new-account") { accountForm(null); return; }
    if (act === "edit-invoice") { invoiceForm(byId(data, "invoices", id)); return; }
    if (act === "edit-bill") { billForm(byId(data, "bills", id)); return; }
    if (act === "edit-expense") { expenseForm(byId(data, "expenses", id)); return; }
    if (act === "edit-account") { accountForm(byId(data, "accounts", id)); return; }
    if (act === "add-line") {
      const form = $("#modal form");
      if (!form || !view._form) return;
      readInvoiceDraft(form);
      view._form.draft.lines.push({ id: uid(), description: "", qty: 1, rate: 0 });
      invoiceForm(view._form.draft);
      return;
    }
    if (act === "remove-line") {
      const form = $("#modal form");
      readInvoiceDraft(form);
      view._form.draft.lines.splice(Number(btn.dataset.i), 1);
      invoiceForm(view._form.draft);
      return;
    }
    if (act === "delete-invoice") { if (confirm("Delete this invoice and its postings?")) { await removeRecord("invoices", id); closeModal(); render(); toast("Invoice deleted"); } return; }
    if (act === "delete-bill") { if (confirm("Delete this bill and its postings?")) { await removeRecord("bills", id); closeModal(); render(); toast("Bill deleted"); } return; }
    if (act === "delete-expense") { if (confirm("Delete this expense and its posting?")) { await removeRecord("expenses", id); closeModal(); render(); toast("Expense deleted"); } return; }
    if (act === "lock-close") {
      const row = closeFor(view.closePeriod);
      CLOSE_ITEMS.forEach(([k]) => { row.items[k] = true; });
      row.status = "closed";
      row.closedAt = now();
      row.updatedAt = now();
      await saveRecord("closeChecklists", row, { post: false });
      render();
      toast("Period locked");
      return;
    }
    if (act === "unlock-close") {
      const row = closeFor(view.closePeriod);
      row.status = "in-progress";
      row.closedAt = null;
      row.updatedAt = now();
      await saveRecord("closeChecklists", row, { post: false });
      render();
      return;
    }
    if (act === "reset-demo") {
      if (!confirm("Reset all local DEMO books?")) return;
      localStorage.removeItem(STORAGE_KEY);
      data = seed();
      persist();
      render();
      toast("DEMO data reset");
    }
  });

  function readInvoiceDraft(form) {
    const fd = new FormData(form);
    const draft = view._form.draft;
    draft.number = fd.get("number");
    draft.clientId = fd.get("clientId");
    draft.phase = fd.get("phase");
    draft.status = fd.get("status");
    draft.date = fd.get("date");
    draft.dueDate = fd.get("dueDate");
    draft.accountId = fd.get("accountId");
    draft.paidDate = fd.get("paidDate") || null;
    draft.memo = fd.get("memo");
    draft.lines = draft.lines.map((l, i) => ({
      ...l,
      description: fd.get("desc-" + i) || "",
      qty: num(fd.get("qty-" + i)),
      rate: num(fd.get("rate-" + i))
    }));
    return draft;
  }

  document.addEventListener("change", async (e) => {
    const box = e.target.closest("[data-act='toggle-close']");
    if (!box) return;
    const row = closeFor(view.closePeriod);
    row.items[box.dataset.key] = box.checked;
    row.status = closeStatusOf(row);
    row.updatedAt = now();
    await saveRecord("closeChecklists", row, { post: false });
    render();
  });

  document.addEventListener("submit", async (e) => {
    const form = e.target.closest("[data-form]");
    if (!form) return;
    e.preventDefault();
    const fd = new FormData(form);
    const kind = form.dataset.form;
    if (kind === "grok") {
      view.grokInput = "";
      sendGrok(fd.get("prompt"));
      return;
    }
    if (kind === "invoice") {
      const existing = view._form?.draft?.id && byId(data, "invoices", view._form.draft.id);
      const draft = readInvoiceDraft(form);
      if (draft.status === "paid" && !draft.paidDate) draft.paidDate = today();
      const record = {
        ...(existing || { createdAt: now() }),
        ...draft,
        id: draft.id,
        updatedAt: now()
      };
      await saveRecord("invoices", record);
      closeModal();
      render();
      toast("Invoice saved");
      return;
    }
    if (kind === "bill") {
      const id = fd.get("id");
      const existing = byId(data, "bills", id);
      const vendorId = fd.get("vendorId");
      const vendor = byId(data, "vendors", vendorId);
      const record = {
        ...(existing || { createdAt: now() }),
        id, number: fd.get("number"), vendorId, category: fd.get("category") || vendor?.category || "other",
        date: fd.get("date"), dueDate: fd.get("dueDate"), status: fd.get("status"),
        accountId: fd.get("accountId"), amount: num(fd.get("amount")),
        paidDate: fd.get("status") === "paid" ? (fd.get("paidDate") || today()) : null,
        memo: fd.get("memo"), updatedAt: now()
      };
      await saveRecord("bills", record);
      closeModal();
      render();
      toast("Bill saved");
      return;
    }
    if (kind === "expense") {
      const id = fd.get("id");
      const existing = byId(data, "expenses", id);
      const record = {
        ...(existing || { createdAt: now() }),
        id, date: fd.get("date"), vendorName: fd.get("vendorName"),
        accountId: fd.get("accountId"), amount: num(fd.get("amount")),
        memberId: fd.get("memberId"), receiptNote: fd.get("receiptNote"),
        paymentAccountId: fd.get("paymentAccountId"), updatedAt: now()
      };
      await saveRecord("expenses", record);
      closeModal();
      render();
      toast("Expense saved");
      return;
    }
    if (kind === "account") {
      const id = fd.get("id");
      const existing = byId(data, "accounts", id);
      const record = {
        ...(existing || { createdAt: now(), active: true }),
        id, number: fd.get("number"), name: fd.get("name"), type: fd.get("type"),
        description: fd.get("description"), updatedAt: now()
      };
      await saveRecord("accounts", record, { post: false });
      closeModal();
      render();
      toast("Account saved");
      return;
    }
    if (kind === "close-notes") {
      const row = closeFor(view.closePeriod);
      row.notes = fd.get("notes") || "";
      row.updatedAt = now();
      await saveRecord("closeChecklists", row, { post: false });
      toast("Notes saved");
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if ($("#modal")?.open) closeModal();
      else if (view.sidebarOpen) { view.sidebarOpen = false; render(); }
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      view.grokOpen = true;
      render();
      $("#grok-panel textarea")?.focus();
    }
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    if (e.key === "n") {
      if (view.screen === "invoices") invoiceForm(null);
      if (view.screen === "bills") billForm(null);
      if (view.screen === "expenses") expenseForm(null);
      if (view.screen === "accounts") accountForm(null);
    }
  });

  window.addEventListener("hashchange", () => {
    const id = location.hash.replace("#", "") || "dashboard";
    if (SCREENS.some(([s]) => s === id) && id !== view.screen) setScreen(id);
  });

  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "prevista:finance:config" && e.data.config) {
      Object.assign(CONFIG, e.data.config);
    }
  });

  window.PrevistaFinance = {
    config: CONFIG,
    api,
    get store() { return data; },
    getState() { return { data, view, company: COMPANY }; },
    setScreen,
    askGrok,
    exportCsv,
    refresh: render
  };

  async function init() {
    try {
      if (CONFIG.mode === "api") await loadRemote();
      else loadLocal();
    } catch (err) {
      console.warn("Finance load failed, seeding local DEMO", err);
      data = seed();
    }
    render();
    window.__ready = true;
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
</body>
</html>
